<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan</title>
  <style>
    :root {
      --bg-primary: #0f1117;
      --text-primary: #f1f5f9;
      --text-muted: #64748b;
      --accent: #6366f1;
    }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 { font-size: 64px; margin: 0 0 16px 0; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { margin: 0 0 32px 0; color: var(--text-muted); font-size: 18px; }
    a { display: inline-block; padding: 12px 24px; background: var(--accent); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
    a:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Halaman yang Anda cari tidak ditemukan.</p>
  <a href="/">Kembali ke Beranda</a>
</body>
</html>
